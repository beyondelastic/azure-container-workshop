# IMPORTANT: In production, use Azure Key Vault or workload identity instead of
# Kubernetes secrets for sensitive values. This file is for workshop purposes only.
#
# Replace the base64-encoded value before applying:
#   echo -n "https://YOUR-PROJECT.services.ai.azure.com/api/projects/YOUR-PROJECT-NAME" | base64
apiVersion: v1
kind: Secret
metadata:
  name: triage-secrets
  namespace: triage
type: Opaque
data:
  AZURE_AI_PROJECT_ENDPOINT: <BASE64_ENCODED_ENDPOINT>

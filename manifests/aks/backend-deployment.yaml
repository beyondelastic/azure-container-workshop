apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-backend
  namespace: triage
  labels:
    app: triage-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-backend
  template:
    metadata:
      labels:
        app: triage-backend
    spec:
      containers:
        - name: backend
          image: <ACR_NAME>.azurecr.io/triage-backend:v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: triage-config
            - secretRef:
                name: triage-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30

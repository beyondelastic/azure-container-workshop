apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-frontend
  namespace: triage
  labels:
    app: triage-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triage-frontend
  template:
    metadata:
      labels:
        app: triage-frontend
    spec:
      containers:
        - name: frontend
          image: <ACR_NAME>.azurecr.io/triage-frontend:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

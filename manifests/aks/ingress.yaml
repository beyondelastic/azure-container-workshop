apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triage-ingress
  namespace: triage
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: triage-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: triage-frontend
                port:
                  number: 80
